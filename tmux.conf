# tmux.conf — github.com/WillieXia/dotfiles-public
#
# Symlinked into place, so editing ~/.tmux.conf edits this repo:
#   ln -sf ~/dotfiles-public/tmux.conf ~/.tmux.conf
#
# Reload a running server with: tmux source-file ~/.tmux.conf

set -g allow-passthrough on
# 'on' rather than 'external': both forward tmux's buffers out to the terminal
# clipboard, but external ignores OSC 52 sent by applications directly.
set -g set-clipboard on
set -g default-command "${SHELL}"
set -g history-limit 500000
# Strip the domain suffix so the status bar shows a bare hostname. The 's///'
# substitution is a no-op on machines whose hostname doesn't carry it.
set -g status-right "#{s/.facebook.com//:host} • %Y-%m-%d %H:%M"
# Without this, tmux never asks the terminal for mouse reporting. WezTerm then
# sees an alternate-screen app that hasn't claimed the mouse and falls back to
# alternate_buffer_wheel_scroll_speed -- translating each wheel notch into arrow
# keys ("scroll wheel is sending arrow keys"), which land in an app's input as
# history navigation rather than scrolling its output. With mouse on, tmux
# negotiates real SGR mouse events and hands them to whichever pane app has
# itself enabled mouse reporting (Claude Code does, in its fullscreen renderer).
set -g mouse on
set -s default-terminal "tmux-256color"
set -s escape-time 50
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
setw -g mode-keys vi

# Keep a pane after its process exits, showing "Pane is dead" with the
# scrollback intact.
#
# The default is to close the pane, and to close the whole window once its last
# pane goes. That loses exactly the evidence you want when something is killed
# rather than quit: a window full of long-running jobs vanishes and leaves no
# trace of what any of them last printed. Twice in one day a set of agents was
# killed under memory pressure and the panes took their own logs with them, so
# there was nothing to read afterwards but the absence.
#
# The cost is that a pane you deliberately `exit` also lingers. That is the
# whole point, but it needs a cheap way out, hence the two bindings below.
setw -g remain-on-exit on
# Prefix R restarts whatever the pane was running (-k kills it first if it is
# somehow still alive); prefix X closes a dead pane for good.
bind R respawn-pane -k
bind X kill-pane

# Label each pane on its own border. With several panes in a window, the border
# is the only always-visible place to say which is which, and `select-pane -T`
# lets a program name itself there — an agent, a tail, a build.
setw -g pane-border-status top
setw -g pane-border-format ' #{pane_index} #{pane_title} '

# Prefix is C-a, not the default C-b. C-a C-a sends a literal C-a through to
# the shell, so readline's beginning-of-line still works.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Resize panes by a visible amount. Default C-<arrow> is 1 cell, which is
# invisible on a wide window. All are -r (repeatable within repeat-time).
bind -r C-Left  resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up    resize-pane -U 3
bind -r C-Down  resize-pane -D 3

# Prefix then < / > moves the current window one position left / right, swapping
# it with its neighbour and keeping it focused; -d stops the neighbour becoming
# active. At either end it wraps around. -r to repeat within repeat-time.
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1
