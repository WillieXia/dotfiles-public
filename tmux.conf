# tmux.conf — github.com/WillieXia/dotfiles-public
#
# Symlinked into place, so editing ~/.tmux.conf edits this repo:
#   ln -sf ~/dotfiles-public/tmux.conf ~/.tmux.conf
#
# Reload a running server with: tmux source-file ~/.tmux.conf

set -g allow-passthrough on
# 'on' rather than 'external': both forward tmux's buffers out to the terminal
# clipboard, but external ignores OSC 52 sent by applications directly.
set -g set-clipboard on
set -g default-command "${SHELL}"
set -g history-limit 500000
# Strip the domain suffix so the status bar shows a bare hostname. The 's///'
# substitution is a no-op on machines whose hostname doesn't carry it.
set -g status-right "#{s/.facebook.com//:host} • %Y-%m-%d %H:%M"
set -s default-terminal "tmux-256color"
set -s escape-time 50
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
setw -g mode-keys vi

# Prefix is C-a, not the default C-b. C-a C-a sends a literal C-a through to
# the shell, so readline's beginning-of-line still works.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Resize panes by a visible amount. Default C-<arrow> is 1 cell, which is
# invisible on a wide window. All are -r (repeatable within repeat-time).
bind -r C-Left  resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up    resize-pane -U 3
bind -r C-Down  resize-pane -D 3

# Prefix then < / > moves the current window one position left / right, swapping
# it with its neighbour and keeping it focused; -d stops the neighbour becoming
# active. At either end it wraps around. -r to repeat within repeat-time.
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1
